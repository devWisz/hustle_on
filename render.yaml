services:
  - type: web
    name: hustleon-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    buildFilter:
      paths:
        - Dockerfile
        - backend/**
        - auth/**
        - database/migrations/**
    envVars:
      # Fail closed. Left to the dashboard, forgetting it would silently enable
      # every development relaxation on a public deployment.
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_PUBLIC_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: ADMIN_WALLETS
        sync: false
      # The same thing for an operator who signs in with an email and a password.
      # At least one of these two must be set, or the API refuses to start.
      - key: ADMIN_EMAILS
        sync: false
      # Optional. Addresses or CIDR ranges allowed to reach the console.
      - key: ADMIN_ALLOWED_IPS
        sync: false
      - key: HUSTLEON_PAY_PROGRAM_ID
        sync: false
      - key: SOLANA_CLUSTER
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: SESSION_COOKIE_DOMAIN
        sync: false
      - key: INTERNAL_PROXY_SECRET
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: LOG_LEVEL
        value: info
