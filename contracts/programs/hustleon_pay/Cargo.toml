[package]
name = "hustleon_pay"
version = "0.1.0"
description = "Sponsorship/support contract for Hustle On"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hustleon_pay"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# Anchor's macros expand to `#[cfg(feature = "...")]` for features of anchor-lang
# itself, which this crate's rustc has never heard of, so every build reported them
# as unexpected condition values. The upstream Anchor template declares all three;
# ours had dropped them, which is why the build was noisy.
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
# `target_os = "solana"` is set by the SBF toolchain, so a plain host build does
# not know it is a real value. Declared rather than silenced, so a genuinely
# unexpected cfg elsewhere is still reported.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
