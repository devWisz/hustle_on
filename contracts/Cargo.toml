[workspace]
members = ["programs/hustleon_pay"]
resolver = "2"

# anchor-syn 0.30.1 calls `proc_macro2::Span::source_file`, which proc-macro2
# removed in 1.0.95 (renamed to `local_file`). anchor 0.30.1's IDL step forces
# `--cfg procmacro2_semver_exempt`, so that call site is compiled and the build
# fails on current toolchains. `vendor/anchor-syn` is the pristine 0.30.1 crate
# with exactly that one call site updated (requires proc-macro2 >= 1.0.95).
[patch.crates-io]
anchor-syn = { path = "vendor/anchor-syn" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
