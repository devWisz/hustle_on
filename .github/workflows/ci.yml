name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            backend/go.sum
            auth/go.mod

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l backend auth)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: |
          cd auth && go vet ./...
          cd ../backend && go vet ./...

      - name: Test
        run: |
          cd auth && go test ./... -race -count=1
          cd ../backend && go test ./... -race -count=1

      - name: Build
        run: cd backend && go build -trimpath ./...

  web:
    name: Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4

      # Every migration is applied and then rolled back in full, so a down file
      # that does not actually reverse its up file fails here rather than during
      # an incident.
      - name: Apply and revert every migration
        env:
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          bash scripts/migrate.sh up
          bash scripts/migrate.sh status
          bash scripts/migrate.sh seed
          for _ in $(ls database/migrations/*.up.sql); do
            bash scripts/migrate.sh down
          done
